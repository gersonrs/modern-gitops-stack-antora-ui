---
name: build-ui-bundle

on:
  push:
    branches: ["main", "modern-gitops-stack"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build Antora UI bundle
        run: npm run bundle

      - name: Publish ui-bundle.zip release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: "${{ github.ref_name }}-latest"
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release delete "$TAG_NAME" --yes --cleanup-tag
          fi
          gh release create "$TAG_NAME" build/ui-bundle.zip \
            --target "${{ github.sha }}" \
            --title "Release $TAG_NAME" \
            --notes "Modern GitOps Stack Antora UI bundle (ui-bundle.zip) built from ${{ github.ref_name }}."
